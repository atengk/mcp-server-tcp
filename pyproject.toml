[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-tcp"
version = "0.1.0"
description = "A versatile TCP client/server proxy MCP server for LLMs"
readme = "README.md"
authors = [
    { name = "Ateng" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.scripts]
mcp-server-tcp = "mcp_server_tcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_tcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
